<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>عشّي — دفتر الطيور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EA;
    --surface:#FFFFFF;
    --surface-2:#F3ECD8;
    --ink:#23301F;
    --ink-soft:#5B6754;
    --forest:#2F4A34;
    --forest-2:#3E5F45;
    --moss:#6B8A5A;
    --clay:#B0592D;
    --gold:#D9A441;
    --sky:#3F7E86;
    --rose:#C4634F;
    --line:#E4DAC0;
    --shadow: 0 2px 10px rgba(47,74,52,0.08), 0 1px 2px rgba(47,74,52,0.06);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Lalezar',sans-serif;
    font-weight:400;
    letter-spacing:.3px;
    color:var(--forest);
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:16px 16px 96px;
    min-height:100vh;
  }
  @media(min-width:860px){
    #app{max-width:760px;padding:28px 28px 40px;}
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ===== top bar ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #EADFAF, var(--gold) 65%, var(--clay) 100%);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:var(--shadow);
  }
  .brand h1{font-size:26px;margin:0;line-height:1;}
  .brand span{display:block;font-size:11px;color:var(--ink-soft);font-family:'Cairo';margin-top:2px;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);
  }
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{
    width:36px;height:36px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow);
    flex-shrink:0;
  }
  .back-row h2{margin:0;font-size:22px;}
  .back-row .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* ===== cards / sections ===== */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }
  .section-title{
    font-family:'Lalezar';font-size:19px;color:var(--forest);
    margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }
  .section-title:first-child{margin-top:0;}
  .empty-note{
    color:var(--ink-soft);font-size:13.5px;background:var(--surface-2);
    border-radius:14px;padding:16px;text-align:center;line-height:1.9;
  }

  /* ===== today tasks ===== */
  .task-banner{
    background:linear-gradient(135deg, var(--forest), var(--forest-2));
    border-radius:var(--radius);color:#fff;padding:16px 16px;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .task-banner h3{color:#F3ECD8;font-size:19px;margin:0 0 8px;font-family:'Lalezar';}
  .task-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-top:8px;
    font-size:13.5px;
  }
  .task-item b{font-family:'Cairo';font-weight:700;}
  .task-item button{
    background:var(--gold);color:#2b1c05;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;flex-shrink:0;
  }

  /* ===== stat row ===== */
  .stat-row{display:flex;gap:10px;margin-bottom:18px;}
  .stat{
    flex:1;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:14px 8px;text-align:center;
  }
  .stat b{display:block;font-family:'Lalezar';font-size:24px;color:var(--clay);}
  .stat span{font-size:11.5px;color:var(--ink-soft);}

  /* ===== species grid ===== */
  .species-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .species-card{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    padding:16px 12px;text-align:center;position:relative;overflow:hidden;
  }
  .species-card .emoji{font-size:34px;display:block;margin-bottom:6px;}
  .species-card b{font-family:'Lalezar';font-size:17px;color:var(--forest);display:block;}
  .species-card span{font-size:11.5px;color:var(--ink-soft);}
  .species-card::after{
    content:"";position:absolute;inset:0;border-radius:18px;
    border:1.5px solid var(--line);pointer-events:none;
  }

  /* ===== buttons ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:26px;font-weight:700;font-size:14.5px;
    box-shadow:var(--shadow);
  }
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-gold{background:var(--gold);color:#2b1c05;}
  .btn-sky{background:var(--sky);color:#fff;}
  .btn-clay{background:var(--clay);color:#fff;}
  .btn-outline{background:var(--surface);color:var(--forest);border:1.5px solid var(--line);box-shadow:none;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:12.5px;border-radius:20px;}
  .btn-danger{background:#fff;color:var(--clay);border:1.5px solid var(--clay);box-shadow:none;}
  .fab{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    z-index:40;
  }
  @media(min-width:860px){.fab{position:static;transform:none;margin-top:10px;}}

  /* ===== bottom nav ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(47,74,52,.08);
  }
  @media(min-width:860px){.bottom-nav{display:none;}}
  .nav-item{flex:1;text-align:center;padding:6px 0;font-size:11px;color:var(--ink-soft);}
  .nav-item .ic{font-size:20px;display:block;margin-bottom:2px;}
  .nav-item.active{color:var(--forest);font-weight:800;}

  /* ===== pair card ===== */
  .pair-card{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;
  }
  .pair-photos{display:flex;flex-shrink:0;}
  .pair-photo{
    width:52px;height:52px;border-radius:50%;object-fit:cover;
    border:2.5px solid var(--surface);box-shadow:var(--shadow);background:var(--surface-2);
  }
  .pair-photo.two{margin-right:-16px;}
  .pair-photo-ph{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:var(--surface-2);border:2.5px solid var(--surface);
  }
  .pair-info{flex:1;min-width:0;}
  .pair-info b{font-family:'Lalezar';font-size:17px;color:var(--forest);display:block;}
  .pair-info .names{font-size:12px;color:var(--ink-soft);}
  .state-badge{
    display:inline-block;margin-top:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;color:#fff;
  }

  /* ===== nest ring (egg progress) ===== */
  .nest-ring{position:relative;width:44px;height:44px;flex-shrink:0;}
  .nest-ring svg{transform:rotate(-90deg);}
  .nest-ring .cnt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:var(--forest);font-family:'Cairo';
  }

  /* ===== bird chip ===== */
  .bird-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px;
  }
  .bird-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .bird-photo-ph{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .bird-row b{font-family:'Cairo';font-weight:700;font-size:14.5px;}
  .bird-row .meta{font-size:11.5px;color:var(--ink-soft);}
  .gender-tag{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:700;}
  .gender-m{background:#DCEBEF;color:var(--sky);}
  .gender-f{background:#F6DEDA;color:var(--rose);}
  .gender-u{background:var(--surface-2);color:var(--ink-soft);}

  /* ===== pair detail hero ===== */
  .pair-hero{
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    border-radius:22px;box-shadow:var(--shadow);padding:22px 16px;text-align:center;margin-bottom:16px;
  }
  .hero-photos{display:flex;justify-content:center;margin-bottom:10px;}
  .hero-photo{
    width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);
    box-shadow:var(--shadow);background:var(--surface-2);
  }
  .hero-photo.two{margin-right:-20px;}
  .hero-photo-ph{
    width:74px;height:74px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    font-size:28px;border:3px solid var(--surface);
  }
  .pair-hero h2{font-size:26px;margin:4px 0 2px;}
  .pair-hero .names{font-size:13px;color:var(--ink-soft);margin-bottom:8px;}

  .action-panel{
    border-radius:18px;padding:16px;margin-bottom:14px;color:#fff;
  }
  .action-panel h4{font-family:'Lalezar';font-size:18px;margin:0 0 6px;}
  .action-panel p{font-size:13px;line-height:1.8;margin:0 0 12px;opacity:.95;}
  .egg-dots{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;}
  .egg-dot{width:22px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:rgba(255,255,255,.9);}
  .countdown-ring-wrap{display:flex;align-items:center;gap:14px;margin:8px 0;}
  .countdown-num{font-family:'Lalezar';font-size:34px;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;}

  .log-list{font-size:12.5px;}
  .log-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);}
  .log-row:last-child{border-bottom:none;}

  /* ===== form ===== */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--forest);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);
    font-size:14px;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700;
  }
  .seg button.active{background:var(--forest);color:#fff;border-color:var(--forest);}
  .photo-upload{
    display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px;margin-bottom:14px;
  }
  .photo-upload img{width:56px;height:56px;border-radius:50%;object-fit:cover;}
  .photo-upload .ph{width:56px;height:56px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;}

  /* ===== modal ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(35,48,31,.45);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:860px){.overlay{align-items:center;}}
  .modal{
    background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    animation:up .22s ease;
  }
  @media(min-width:860px){.modal{border-radius:24px;max-height:80vh;}}
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:21px;}
  .modal-close{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:16px;}

  /* ===== tree ===== */
  .tree-wrap{overflow-x:auto;padding:10px 4px 4px;}
  .tree-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .tree-pair-box{
    display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:16px;
    box-shadow:var(--shadow);padding:8px 10px;border:1.5px solid var(--line);
  }
  .tree-mini-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface-2);}
  .tree-mini-photo-ph{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;}
  .tree-plus{color:var(--clay);font-weight:800;font-size:13px;margin:0 2px;}
  .tree-children{display:flex;gap:22px;position:relative;padding-top:22px;margin-top:4px;}
  .tree-branch{
    position:relative;display:flex;flex-direction:column;align-items:center;
  }
  .tree-branch::before{
    content:"";position:absolute;top:-22px;right:50%;width:2px;height:22px;background:var(--moss);
  }
  .tree-children::after{
    content:"";position:absolute;top:0;right:calc(50% / var(--n,1));left:calc(50% / var(--n,1));height:2px;background:var(--moss);
  }
  .tree-child-card{
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 10px;
    display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);
  }
  .tree-child-card span.nm{font-size:12px;font-weight:700;}
  .tree-child-card.leaf{opacity:.9;}

  /* fade in */
  .view-fade{animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .link-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:13px;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--forest);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;
    box-shadow:var(--shadow); animation:fadein .2s ease;
  }

  /* ===== quail / production dashboard ===== */
  .quail-hero{
    background:linear-gradient(160deg,#F3ECD8,#FFF);border-radius:22px;box-shadow:var(--shadow);
    padding:26px 16px;text-align:center;margin-bottom:16px;
  }
  .quail-hero .big-num{font-family:'Lalezar';font-size:52px;color:var(--clay);line-height:1;}
  .quail-hero .lbl{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .quail-stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .quail-stat{flex:1;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px;text-align:center;}
  .quail-stat b{display:block;font-family:'Lalezar';font-size:21px;color:var(--sky);}
  .quail-stat span{font-size:11px;color:var(--ink-soft);}

  /* ===== finance ===== */
  .money-summary{display:flex;gap:10px;margin-bottom:16px;}
  .money-card{flex:1;border-radius:16px;box-shadow:var(--shadow);padding:14px 10px;text-align:center;color:#fff;}
  .money-card b{display:block;font-family:'Lalezar';font-size:19px;}
  .money-card span{font-size:11px;opacity:.9;}
  .tx-row{
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border-radius:14px;box-shadow:var(--shadow);padding:11px 13px;margin-bottom:9px;
  }
  .tx-cat{font-size:12.5px;color:var(--ink-soft);}
  .tx-amt{font-family:'Cairo';font-weight:800;font-size:15px;}
  .tx-amt.pos{color:var(--moss);}
  .tx-amt.neg{color:var(--clay);}
  .cat-pill{display:inline-block;background:var(--surface-2);border-radius:10px;padding:2px 9px;font-size:11px;margin:3px 4px 0 0;}
  .cat-pill.active{background:var(--forest);color:#fff;}
</style>
</head>
<body>
<div id="app"><div style="padding:60px 0;text-align:center;color:var(--ink-soft);">جارِ التحميل…</div></div>

<script>
/* ================= STORAGE ================= */
const DATA_KEY = 'app-data-v1';
let DATA = { species: [], birds: [], pairs: [], transactions: [] };
const EXPENSE_CATS = ['أكل','دواء وعلاج','شراء طيور','معدات وأدوات','مصاريف تانية'];
const INCOME_CATS = ['بيع طيور','بيع بيض','إيراد تاني'];
let loaded = false;

async function loadData(){
  try{
    const res = await window.storage.get(DATA_KEY, false);
    if(res && res.value){ DATA = Object.assign({species:[],birds:[],pairs:[],transactions:[]}, JSON.parse(res.value)); }
  }catch(e){ /* no data yet */ }
  loaded = true;
}
let saveTimer=null;
async function saveData(){
  try{ await window.storage.set(DATA_KEY, JSON.stringify(DATA), false); }
  catch(e){ console.error('save failed', e); showToast('في مشكلة في الحفظ، حاول تاني'); }
}

/* ================= HELPERS ================= */
const uid = ()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr = ()=> new Date().toISOString().slice(0,10);
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00'); return Math.round((d2-d1)/86400000); }
function fmtDate(d){ if(!d) return '—'; const parts=d.split('-'); const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']; return `${+parts[2]} ${months[+parts[1]-1]}`; }
function getSpecies(id){ return DATA.species.find(s=>s.id===id); }
function getBird(id){ return DATA.birds.find(b=>b.id===id); }
function getPair(id){ return DATA.pairs.find(p=>p.id===id); }
function pairsOfSpecies(sid){ return DATA.pairs.filter(p=>p.speciesId===sid); }
function unpairedBirdsOfSpecies(sid){ return DATA.birds.filter(b=>b.speciesId===sid && !b.pairId); }
function birdsOfSpecies(sid){ return DATA.birds.filter(b=>b.speciesId===sid); }

const STATE_META = {
  rest:     {label:'في راحة',    color:'var(--moss)'},
  production:{label:'في تزاوج',  color:'var(--clay)'},
  laying:   {label:'بتبيض',      color:'var(--gold)'},
  incubating:{label:'بتحضن',     color:'var(--sky)'},
};
function stateColor(s){ return {rest:'#6B8A5A',production:'#B0592D',laying:'#D9A441',incubating:'#3F7E86'}[s]||'#6B8A5A'; }

function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* image resize -> base64 */
function readAndResize(file, maxDim=360, quality=0.62){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else{ if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ================= ROUTER ================= */
let ROUTE = { view:'home', params:{} };
function go(view, params={}){ ROUTE={view,params}; window.scrollTo(0,0); render(); }

/* ================= TODAY TASKS ================= */
function getTodayTasks(){
  const t=todayStr();
  const tasks=[];
  DATA.pairs.forEach(p=>{
    if(p.state==='laying' || p.state==='production'){
      const loggedToday = p.eggs.some(e=>e.date===t);
      if(!loggedToday){
        tasks.push({type:'egg', pair:p, label:`${p.name||'زوج'} — باضت النهارده؟`});
      }
    }
    if(p.state==='incubating' && p.expectedHatchDate && t>=p.expectedHatchDate){
      const loggedToday = (p.hatchLog||[]).some(h=>h.date===t);
      if(!loggedToday){
        tasks.push({type:'hatch', pair:p, label:`${p.name||'زوج'} — كام فرخ فقس النهارده؟`});
      }
    }
  });
  DATA.species.forEach(sp=>{
    if(sp.type==='production'){
      const loggedToday=(sp.eggLogs||[]).some(e=>e.date===t);
      if(!loggedToday){ tasks.push({type:'quail', sp, label:`${sp.emoji} ${sp.name} — سجل بيض النهارده`}); }
    }
  });
  return tasks;
}

/* ================= ACTIONS ================= */
async function addSpecies(name, emoji, incubationDays, type){
  type = type || 'breeding';
  const sp = {id:uid(), name, emoji, type, createdAt:todayStr()};
  if(type==='breeding'){ sp.incubationDays = +incubationDays||18; }
  else { sp.eggLogs = []; }
  DATA.species.push(sp);
  await saveData();
  return sp;
}
async function logQuailEgg(speciesId, count){
  const sp=getSpecies(speciesId); const t=todayStr();
  sp.eggLogs = sp.eggLogs||[];
  const existing = sp.eggLogs.find(e=>e.date===t);
  if(existing) existing.count = count; else sp.eggLogs.push({date:t, count});
  await saveData(); render(); showToast('اتسجل بيض النهارده 🥚');
}
function sumEggLogsSince(sp, sinceDate){
  return (sp.eggLogs||[]).filter(e=>e.date>=sinceDate).reduce((s,e)=>s+e.count,0);
}
function sumEggLogsAll(sp){ return (sp.eggLogs||[]).reduce((s,e)=>s+e.count,0); }
async function addBird(data){
  const b={ id:uid(), name:data.name, speciesId:data.speciesId, gender:data.gender, color:data.color||'',
    birthDate:data.birthDate||'', price:data.price||'', notes:data.notes||'', photo:data.photo||'',
    pairId:null, parentPairId:data.parentPairId||null, createdAt:todayStr() };
  DATA.birds.push(b);
  await saveData();
  return b;
}
async function addPair(speciesId, name, maleId, femaleId, photo){
  const p={ id:uid(), speciesId, name, maleId, femaleId, photo:photo||'',
    state:'rest', eggs:[], incubationStartDate:null, expectedHatchDate:null, hatchLog:[],
    cycleHistory:[], createdAt:todayStr() };
  DATA.pairs.push(p);
  if(maleId){ getBird(maleId).pairId=p.id; }
  if(femaleId){ getBird(femaleId).pairId=p.id; }
  await saveData();
  return p;
}
async function startMating(pairId){
  const p=getPair(pairId); p.state='production'; await saveData(); render();
}
async function logEgg(pairId){
  const p=getPair(pairId); const t=todayStr();
  if(p.eggs.some(e=>e.date===t)){ showToast('اتسجلت بيضة النهارده خلاص'); return; }
  p.eggs.push({date:t});
  if(p.state==='production') p.state='laying';
  const sp=getSpecies(p.speciesId);
  if(p.eggs.length===3 && !p.incubationStartDate){
    p.incubationStartDate=t;
    p.expectedHatchDate=addDays(t, sp?sp.incubationDays:18);
    p.state='incubating';
  }
  await saveData(); render(); showToast('تمام، اتسجلت البيضة 🥚');
}
async function logHatch(pairId, count){
  const p=getPair(pairId); const t=todayStr();
  p.hatchLog=p.hatchLog||[];
  const existing=p.hatchLog.find(h=>h.date===t);
  if(existing) existing.count+=count; else p.hatchLog.push({date:t, count});
  await saveData(); render(); showToast(`سجلنا ${count} 🐣`);
}
async function finishHatching(pairId){
  const p=getPair(pairId);
  const total=(p.hatchLog||[]).reduce((s,h)=>s+h.count,0);
  const sp=getSpecies(p.speciesId);
  const newIds=[];
  for(let i=1;i<=total;i++){
    const b=await addBirdSilent({ name:`زغلول ${i}`, speciesId:p.speciesId, gender:'u', birthDate:todayStr(), parentPairId:p.id });
    newIds.push(b.id);
  }
  p.cycleHistory.push({ eggs:p.eggs.length, hatched:total, start:p.incubationStartDate, end:todayStr(), childIds:newIds });
  p.eggs=[]; p.incubationStartDate=null; p.expectedHatchDate=null; p.hatchLog=[]; p.state='rest';
  await saveData(); render(); showToast(total>0?`تهانينا! ${total} فرخ جديد 🎉`:'خلصنا الدورة دي');
}
async function addBirdSilent(data){
  const b={ id:uid(), name:data.name, speciesId:data.speciesId, gender:data.gender||'u', color:'',
    birthDate:data.birthDate||'', price:'', notes:'', photo:'', pairId:null, parentPairId:data.parentPairId||null, createdAt:todayStr() };
  DATA.birds.push(b);
  return b;
}
async function cancelIncubation(pairId){
  const p=getPair(pairId);
  p.cycleHistory.push({ eggs:p.eggs.length, hatched:0, start:p.incubationStartDate, end:todayStr(), childIds:[], failed:true });
  p.eggs=[]; p.incubationStartDate=null; p.expectedHatchDate=null; p.hatchLog=[]; p.state='rest';
  await saveData(); render(); showToast('اتسجلت كدورة ملهاش نتيجة، رجع الجوز يستريح');
}
async function setPairRest(pairId){
  const p=getPair(pairId); p.state='rest'; await saveData(); render();
}
async function deletePair(pairId){
  const p=getPair(pairId);
  if(p.maleId && getBird(p.maleId)) getBird(p.maleId).pairId=null;
  if(p.femaleId && getBird(p.femaleId)) getBird(p.femaleId).pairId=null;
  DATA.pairs=DATA.pairs.filter(x=>x.id!==pairId);
  await saveData(); go('speciesDetail',{id:p.speciesId});
}
async function deleteBird(birdId){
  const b=getBird(birdId);
  DATA.birds=DATA.birds.filter(x=>x.id!==birdId);
  DATA.pairs.forEach(p=>{ if(p.maleId===birdId)p.maleId=null; if(p.femaleId===birdId)p.femaleId=null; });
  await saveData(); go('speciesDetail',{id:b.speciesId});
}
async function updateBird(id, fields){ Object.assign(getBird(id), fields); await saveData(); }
async function updatePair(id, fields){ Object.assign(getPair(id), fields); await saveData(); }
async function addTransaction(type, amount, category, note, date){
  DATA.transactions.push({id:uid(), type, amount:+amount, category, note:note||'', date:date||todayStr()});
  await saveData();
}
async function deleteTransaction(id){
  DATA.transactions = DATA.transactions.filter(t=>t.id!==id);
  await saveData(); render();
}
function txSumSince(sinceDate, type){
  return DATA.transactions.filter(t=> t.date>=sinceDate && (!type || t.type===type)).reduce((s,t)=>s+t.amount,0);
}
function monthStartStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }

function renderProductionSpecies(sp){
  const t=todayStr();
  const todayEntry=(sp.eggLogs||[]).find(e=>e.date===t);
  const todayCount = todayEntry? todayEntry.count : 0;
  const weekAgo = addDays(t,-6);
  const weekTotal = sumEggLogsSince(sp, weekAgo);
  const monthTotal = sumEggLogsSince(sp, monthStartStr());
  const allTotal = sumEggLogsAll(sp);
  const history = (sp.eggLogs||[]).slice().reverse().slice(0,14);
  return `
  <div class="view-fade">
    <div class="back-row">
      <button class="back-btn" onclick="go('speciesList')">→</button>
      <div><h2>${sp.emoji} ${sp.name}</h2><div class="sub">إنتاج بيض يومي</div></div>
    </div>

    <div class="quail-hero">
      <div class="big-num">${todayCount}</div>
      <div class="lbl">بيضة اتجمعت النهارده</div>
      <div style="margin-top:14px;">
        <button class="btn btn-gold" onclick="modalLogQuail('${sp.id}', ${todayCount})">${todayEntry? 'تعديل عدد النهارده':'سجل بيض النهارده'}</button>
      </div>
    </div>

    <div class="quail-stat-row">
      <div class="quail-stat"><b>${weekTotal}</b><span>آخر 7 أيام</span></div>
      <div class="quail-stat"><b>${monthTotal}</b><span>الشهر ده</span></div>
      <div class="quail-stat"><b>${allTotal}</b><span>إجمالي كل الوقت</span></div>
    </div>

    <div class="section-title">📋 سجل الأيام اللي فاتت</div>
    ${history.length? `<div class="card"><div class="log-list">${history.map(e=>`<div class="log-row"><span>${fmtDate(e.date)}</span><span>${e.count} بيضة</span></div>`).join('')}</div></div>` : `<div class="empty-note">لسه مفيش بيض متسجل.</div>`}

    <button class="btn btn-danger btn-block" style="margin-top:22px;" onclick="if(confirm('حذف النوع ده هيمسح كل سجل البيض بتاعه، متأكد؟')){deleteSpecies('${sp.id}')}">حذف النوع ده</button>
  </div>`;
}

/* ================= FAMILY TREE ================= */
function birdChip(b, extra=''){
  if(!b) return '';
  return `<button class="tree-child-card ${extra}" onclick="go('birdDetail',{id:'${b.id}'})">
    ${b.photo?`<img class="tree-mini-photo" src="${b.photo}">`:`<div class="tree-mini-photo-ph">${b.gender==='m'?'♂️':b.gender==='f'?'♀️':'🐤'}</div>`}
    <span class="nm">${b.name}</span>
  </button>`;
}
function pairBox(p){
  const male=p.maleId?getBird(p.maleId):null, female=p.femaleId?getBird(p.femaleId):null;
  return `<button class="tree-pair-box" onclick="go('pairDetail',{id:'${p.id}'})">
    ${male?(male.photo?`<img class="tree-mini-photo" src="${male.photo}">`:`<div class="tree-mini-photo-ph">♂️</div>`):''}
    <span class="tree-plus">+</span>
    ${female?(female.photo?`<img class="tree-mini-photo" src="${female.photo}">`:`<div class="tree-mini-photo-ph">♀️</div>`):''}
  </button>`;
}
function renderFamilyTree(pairId, visited){
  visited = visited || new Set();
  if(visited.has(pairId)) return '';
  visited.add(pairId);
  const p=getPair(pairId);
  if(!p) return '';
  const children = DATA.birds.filter(b=>b.parentPairId===pairId);
  let childrenHtml='';
  if(children.length){
    childrenHtml = `<div class="tree-children" style="--n:${children.length}">
      ${children.map(c=>{
        const subPair = c.pairId ? getPair(c.pairId) : null;
        return `<div class="tree-branch">
          ${birdChip(c)}
          ${subPair ? `<div style="margin-top:14px;position:relative;">${renderSubtree(subPair.id, visited)}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }
  return `<div class="tree-node">${pairBox(p)}${childrenHtml}</div>`;
}
function renderSubtree(pairId, visited){
  if(visited.has(pairId)) return '';
  visited.add(pairId);
  const p=getPair(pairId);
  if(!p) return '';
  const children = DATA.birds.filter(b=>b.parentPairId===pairId);
  let childrenHtml='';
  if(children.length){
    childrenHtml = `<div class="tree-children" style="--n:${children.length}">
      ${children.map(c=>{
        const subPair = c.pairId ? getPair(c.pairId) : null;
        return `<div class="tree-branch">
          ${birdChip(c)}
          ${subPair ? `<div style="margin-top:14px;">${renderSubtree(subPair.id, visited)}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }
  return `<div class="tree-node">${pairBox(p)}${childrenHtml}</div>`;
}

  openModal(`
    <div class="modal-head"><h3>اختار النوع</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${DATA.species.filter(s=>s.type!=='production').map(s=>`<button class="btn btn-outline btn-block" style="margin-bottom:8px;" onclick="closeModal();${kind==='bird'?`modalAddBird('${s.id}')`:`modalAddPair('${s.id}')`}">${s.emoji} ${s.name}</button>`).join('')}
  `);
}

/* ================= BOTTOM NAV ================= */
function renderBottomNav(){
  const home = ROUTE.view==='home';
  const species = ROUTE.view==='speciesList'||ROUTE.view==='speciesDetail'||ROUTE.view==='pairDetail'||ROUTE.view==='birdDetail';
  const finance = ROUTE.view==='finance';
  return `
  <div class="bottom-nav">
    <button class="nav-item ${home?'active':''}" onclick="go('home')"><span class="ic">🏠</span>الرئيسية</button>
    <button class="nav-item ${species?'active':''}" onclick="go('speciesList')"><span class="ic">🐦</span>الأنواع</button>
    <button class="nav-item" onclick="openQuickAdd()"><span class="ic">➕</span>إضافة</button>
    <button class="nav-item ${finance?'active':''}" onclick="go('finance')"><span class="ic">💰</span>الفلوس</button>
  </div>`;
}

/* ================= MAIN RENDER ================= */
function render(){
  let html='';
  if(ROUTE.view==='home') html=renderHome();
  else if(ROUTE.view==='speciesList') html=renderSpeciesList();
  else if(ROUTE.view==='speciesDetail') html=renderSpeciesDetail(ROUTE.params.id, ROUTE.params.tab);
  else if(ROUTE.view==='pairDetail') html=renderPairDetail(ROUTE.params.id);
  else if(ROUTE.view==='birdDetail') html=renderBirdDetail(ROUTE.params.id);
  else if(ROUTE.view==='finance') html=renderFinance();
  document.getElementById('app').innerHTML = html + renderBottomNav();
}

/* ================= INIT ================= */
(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
